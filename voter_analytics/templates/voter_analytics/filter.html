    <h2>Filter</h2>
    <form action="">
        <table>
            <tr>
                <th><label for="party">Party</label></th>
                <td>
                    <select name="party" id="party">
                        <option value="">Any</option>
                        {% for p in parties %}
                        <option value="{{p}}" {% if request.GET.party == p %} selected {% endif %}>{{p}}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>

            <tr>
                <th><label for="min_dob">Min Year of Birth</label></th>
                <td>
                    <select name="min_dob" id="min_dob">
                        <option value="">Any</option>
                        {% for i in years %}
                        <option value="{{i}}" {% if request.GET.min_dob == i %} selected {% endif %}>{{i}}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>

            <tr>
                <th><label for="max_dob">Max Year of Birth</label></th>
                <td>
                    <select name="max_dob" id="max_dob">
                        <option value="">Any</option>
                        {% for i in years %}
                        <option value="{{i}}" {% if request.GET.max_dob == i %} selected {% endif %}>{{i}}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>

            <tr>
                <th><label for="voter_score">Voter Score</label></th>
                <td>
                    <select name="voter_score" id="voter_score">
                        <option value="">Any</option>
                        {% for i in scores %}
                        <option value="{{i}}" {% if request.GET.voter_score == i %} selected {% endif %}>{{i}}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>
        </table>
        <table>
            <tr>
                <th><label for="v20state"></label>v20state</th>
                <td>
                    <input type="checkbox" name="v20state" id="v20state" {% if request.GET.v20state %} checked {% endif %}>
                </td>
            </tr>
            <tr>
                <th><label for="v21town"></label>v21town</th>
                <td>
                    <input type="checkbox" name="v21town" id="v21town" {% if request.GET.v21town %} checked {% endif %}>
                </td>
            </tr>
            <tr>
                <th><label for="v21primary"></label>v21primary</th>
                <td>
                    <input type="checkbox" name="v21primary" id="v21primary" {% if request.GET.v21primary %} checked {% endif %}>
                </td>
            </tr>
            <tr>
                <th><label for="v22general"></label>v22general</th>
                <td>
                    <input type="checkbox" name="v22general" id="v22general" {% if request.GET.v22general %} checked {% endif %}>
                </td>
            </tr>
            <tr>
                <th><label for="v23town"></label>v23town</th>
                <td>
                    <input type="checkbox" name="v23town" id="v23town" {% if request.GET.v23town %} checked {% endif %}>
                </td>
            </tr>
        </table>


        <input type="submit" value="Filter">
    </form>
