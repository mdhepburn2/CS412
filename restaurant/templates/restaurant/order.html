{% extends 'restaurant/base.html' %}
    {% block content %}
        <h2>order</h2>
        <form action="{% url 'confirmation' %}" method="POST">
            {% csrf_token %}

            <h3>Menu</h3>

            <div class="menu-item">
                <input type="checkbox" name="pizza" id="pizza">
                <label for="pizza">Pizza $12</label>
            </div>
            <select name="pizza_topping" id="pizza_topping">
                <option value="Cheese">Cheese</option>
                <option value="Pepperoni">Pepperoni +$1</option>
                <option value="Sausage">Sausage +$1</option>
                <option value="Barbecue Chicken">Barbecue Chicken +$3</option>
            </select>

            <div class="menu-item">
                <input type="checkbox" name="lasagna" id="lasagna">
                <label for="lasagna">Lasagna $13</label>
            </div>
            <div class="menu-item">
                <input type="checkbox" name="chicken_parmesan" id="chicken_parmesan">
                <label for="chicken_parmesan">Chicken Parmesan $16</label>
            </div>
            <div class="menu-item">
                <input type="checkbox" name="tagliatelle_bolognese" id="tagliatelle_bolognese">
                <label for="tagliatelle_bolognese">Tagliatelle Bolognese $15</label>
            </div>

            <h3>Daily special:</h3>
            <div class="menu-item">
                <input type="checkbox" name="special" id="special">
                <label for="special">{{special}} $20</label>
            </div>

            <h3>Special instructions:</h3>
            <textarea name="special_instructions"></textarea>

            <h3>Customer Info:</h3>
            <div class="field-row">
                <label for="name">Name:</label>
                <input type="text" name="name" id="name">
            </div>
            <div class="field-row">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email">
            </div>
            <div class="field-row">
                <label for="phone">Phone:</label>
                <input type="tel" name="phone" id="phone">
            </div>

            <input type="submit">

        </form>
    {% endblock %}
