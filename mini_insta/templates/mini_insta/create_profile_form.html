{% extends 'mini_insta/base.html' %}

{% block content %}
    
    <h1>Register account</h1>

    <form action="{% url 'create_profile' %}" method="POST">
        {% csrf_token %}
        <table>
            {{ucform.as_table}}
            {{form.as_table}}
        </table>
        <input type="submit">
    </form>
    

{% endblock %}
