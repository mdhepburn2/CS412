{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mini Insta</title>
        <link rel="stylesheet" href="{% static 'insta-styles.css' %}">
    </head>
    <body>
        <h1 class="site-title"><a href="{% url 'show_all_profiles' %}">Mini Insta</a></h1>

        {% block content %}
        {% endblock %}

        <footer>
            <nav>
                <ul>
                    {% if profile %}
                    <li><a href="{% url 'show_feed' profile.pk %}">Feed</a></li>
                    <li><a href="{% url 'create_post' profile.pk %}">New post</a></li>
                    <li><a href="{% url 'update_profile' profile.pk %}">Update profile</a></li>
                    {% endif %}
                    {% if post %}
                    <li><a href="{% url 'update_post' post.pk %}">Update post</a></li>
                    <li><a href="{% url 'delete_post' post.pk %}">Delete post</a></li>
                    {% endif %}
                </ul>
            </nav>
        </footer>
    </body>
</html>
