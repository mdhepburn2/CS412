{% extends 'mini_insta/base.html' %}

{% block content %}
    <h1>New Post by @{{profile.username}}</h1>

    <form action="" method="POST">
        {% csrf_token %}
        <table>
            {{form.as_table}}
            <strong>Image url</strong> <input type="url" name="image_url">
        </table>

        <input type="submit">
        <a href="{% url 'show_profile' profile.pk%}">Cancel</a>
    </form>

{% endblock %}
