{% extends 'mini_insta/base.html' %}

{% block content %}

    <h2 class="profile-name">{{profile.display_name}}</h2>

    <div class="profile-card">
        <img src="{{profile.profile_image_url}}" alt="{{profile.display_name}}'s profile photo">

        <div class="profile-info">
            <h3>@{{profile.username}}</h3>

            <div class="account-numbers">
                <!-- will be implemented later -->
                <p><strong>0</strong><span>Followers</span></p>
                <p><strong>0</strong><span>Following</span></p>
                <p><strong>0</strong><span>Posts</span></p>
            </div>

            <!-- linebreaksbr lets linebreaks in db entry show up in bio -->
            <p class="bio">{{profile.bio_text|linebreaksbr}}</p> 
        </div>
    </div>

    <div class="account-age">
        <p>User since {{profile.join_date}}</p>
    </div>

    <div class="profile-posts">
        <!-- user posts will go here -->
         <!-- {{profile.get_all_posts}} -->
          <!-- Loop to display all posts -->
        {% for post in profile.get_all_posts %}
            <a href="{% url 'show_post' post.pk %}"><img src="{{post.get_first_photo.get_image_url}}" alt=""></a>
        {% endfor %}
    </div>

{% endblock %}
