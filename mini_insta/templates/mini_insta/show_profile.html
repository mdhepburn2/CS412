{% extends 'mini_insta/base.html' %}

{% block content %}

    <div class="profile-header">
        <h2>{{profile.display_name}}</h2>
        <h3>@{{profile.username}}</h3>
        <img src={{profile.profile_image_url}} alt="">
    </div>
    <div class="profile-body">
        <p>{{profile.bio_text}}</p>

        <div class="account-numbers">
            <!-- will be implemented later -->
             <p>Followers: <strong>0</strong></p>
             <p>Following: <strong>0</strong></p>
             <p>Posts: <strong>0</strong></p>
        </div>
    </div>

    <div class="account-age">
        <p>User since {{profile.join_date}}</p>
    </div>


{% endblock %}
