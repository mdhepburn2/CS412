{% extends 'mini_insta/base.html' %}

{% block content %}
    <h1>Update post</h1>

    <form action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <table>
            
            <tr>
                <strong>Select Photos </strong> <input type="file" name="files" multiple>
                {{form.as_table}}
            </tr>
        </table>

        <input type="submit" value="Update">
        <a href="{% url 'show_post' post.pk%}">Cancel</a>
    </form>

{% endblock %}
