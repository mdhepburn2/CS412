{% extends 'quotes/base.html' %}
<!-- Quote page, uses context variables to show an image with a quote under it -->
    {% block content %}
        <h1>Frank Ocean Quotes</h1>
        <div class="quote-img">
            <figure>
                <img src={{img}} alt="Frank Ocean">
                <figcaption>{{quote}}</figcaption>
            </figure>
        </div>
        <!-- <p>{{quote}}</p> -->
    {% endblock %}
