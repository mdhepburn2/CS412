{% extends 'quotes/base.html' %}
<!-- Show all page, uses django loops to put all images in a grid and all the quotes beneath it -->
    {% block content %}
        <h1>Show all</h1>
        <div class="image-grid">
            {% for img in images %}
                <div class="image-grid-item">
                    <img src={{img}} alt="">
                </div>
            {% endfor %}
        </div>
        {% for quote in quotes %}
            <p>{{quote}}</p>
        {% endfor %}

    {% endblock %}
